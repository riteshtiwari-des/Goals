<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goal Tracker</title>
<meta name="application-name" content="Goals">
<meta name="theme-color" content="#EEF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Goals">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9C%85%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --paper:#EEF1EC; --sheet:#FFFFFF; --ink:#1E3354; --ink-soft:#56647A; --rule:#D3D9D1;
  --mark:#F2D64B; --mark-ink:#3B3200; --done-bg:#FBF3C4; --part-bg:#E6EEF8; --danger:#A3302A; --ok:#2F6B3A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141A22; --sheet:#1C2430; --ink:#E4EAF3; --ink-soft:#9AA7B8; --rule:#2E3A4A;
    --mark:#E7C93A; --mark-ink:#1A1600; --done-bg:#3A3518; --part-bg:#22324A; --danger:#F08A80; --ok:#86CF93;
  }
}
:root[data-theme="dark"]{
  --paper:#141A22; --sheet:#1C2430; --ink:#E4EAF3; --ink-soft:#9AA7B8; --rule:#2E3A4A;
  --mark:#E7C93A; --mark-ink:#1A1600; --done-bg:#3A3518; --part-bg:#22324A; --danger:#F08A80; --ok:#86CF93;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:10px 16px 96px}
h1,h2,h3{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:var(--ink)}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
[hidden]{display:none!important}
.btn{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.small{min-height:32px;padding:4px 10px;font-size:.88rem}
.icon{background:none;border:0;cursor:pointer;padding:4px 7px;border-radius:8px;color:var(--ink-soft);min-width:34px;min-height:34px;font-size:.95rem}
.icon:hover{background:var(--paper)}
.icon.on{background:var(--mark);color:var(--mark-ink)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:6px 0 10px;border-bottom:1px solid var(--rule)}
.datebar{display:flex;align-items:center;gap:8px}
.datebar h1{font-size:1.35rem;font-weight:700;flex:1;line-height:1.15;cursor:pointer}
.datebar .btn{width:40px;padding:0}
#datePick{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.summary{margin-top:6px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;color:var(--ink-soft);font-size:.92rem}
.summary strong{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1.45rem;color:var(--ink)}
.budget{margin-top:8px;font-size:.85rem;color:var(--ink-soft)}
.meter{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;margin-top:3px}
.meter i{display:block;height:100%;background:var(--ink)}
.meter.over i{background:var(--danger)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(42px,1fr));gap:4px;margin-top:8px}
.strip span{height:24px;border-radius:4px;background:var(--rule);position:relative;overflow:hidden;font-size:.62rem;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-weight:700}
.strip span i{position:absolute;inset:0;background:var(--mark);transform-origin:left;transform:scaleX(0);transition:transform .35s ease}
.strip span b{position:relative}
.strip span.on b{color:var(--mark-ink)}
.timerbar{margin-top:8px;background:var(--ink);color:var(--sheet);border-radius:12px;padding:8px 10px 8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.timerbar .tt{flex:1;min-width:150px;font-size:.9rem;line-height:1.3}
.timerbar .tt b{display:block;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1.35rem;font-variant-numeric:tabular-nums}
.timerbar .btn{background:transparent;color:var(--sheet);border-color:rgba(255,255,255,.4)}
:root[data-theme="dark"] .timerbar .btn{border-color:rgba(0,0,0,.35)}
.timerbar .btn.primary{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.status{font-size:.8rem;color:var(--ink-soft);margin-top:4px;min-height:1.2em}
.banner{background:var(--mark);color:var(--mark-ink);border-radius:12px;padding:10px 12px;margin:10px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.92rem}
.banner span{flex:1;min-width:180px}
.banner .btn{background:rgba(255,255,255,.55);border-color:transparent;color:var(--mark-ink)}
.tabs{display:flex;gap:6px;margin:12px 0 10px;flex-wrap:wrap}
.tabs [role=tab][aria-selected="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tools input[type=search]{flex:1;min-width:150px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:8px 12px;min-height:40px}
.tools select{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:8px;min-height:40px;max-width:100%}
.editbar{background:var(--mark);color:var(--mark-ink);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.92rem}
details.goal{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;margin:10px 0}
details.goal>summary{list-style:none;cursor:pointer;padding:12px 10px 12px 16px;display:flex;gap:10px;align-items:center}
details.goal>summary::-webkit-details-marker{display:none}
.gcode{font-weight:700;font-size:.8rem;background:var(--ink);color:var(--sheet);border-radius:6px;padding:2px 7px}
.ghead{flex:1;min-width:0}
.gname{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;font-size:1.06rem;display:block}
.gmeta{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-soft)}
.gmeta .met{color:var(--ok);font-weight:700}
.mini{display:inline-block;width:60px;height:6px;background:var(--rule);border-radius:3px;overflow:hidden;vertical-align:middle;margin-left:4px}
.mini i{display:block;height:100%;background:var(--ok)}
.gcount{color:var(--ink-soft);font-size:.86rem;white-space:nowrap}
.sub{padding:0 10px 8px 16px;border-top:1px solid var(--rule)}
.subhead{display:flex;align-items:center;gap:2px;padding:10px 0 2px}
.subhead h3{font-size:.95rem;font-weight:500;color:var(--ink-soft);flex:1}
.subhead h3 em{font-style:normal;font-weight:700;color:var(--ink);margin-right:6px}
.task{display:flex;gap:10px;align-items:flex-start;padding:7px 4px 7px 6px;border-radius:8px}
.task input[type=checkbox]{width:22px;height:22px;margin:3px 0 0;accent-color:var(--ink);flex:none;cursor:pointer}
.chk-ph{width:22px;flex:none;text-align:center;color:var(--ok);font-weight:700}
.task .t{flex:1;min-width:0;cursor:pointer}
.task .c{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.76rem;color:var(--ink-soft);font-weight:700}
.task .n{display:block;font-size:.84rem;color:var(--ink-soft);margin-top:2px}
.task.done{background:var(--done-bg)}
.task.partial{background:var(--part-bg)}
.task.done .txt{text-decoration:line-through;text-decoration-color:var(--ink-soft)}
.bd{font-weight:700;font-size:.7rem;border:1px solid var(--rule);border-radius:999px;padding:0 6px;background:var(--sheet)}
.bd.star{color:var(--mark-ink);background:var(--mark);border-color:var(--mark)}
.bd.late{color:var(--sheet);background:var(--danger);border-color:var(--danger)}
.bd.soon{border-color:var(--danger);color:var(--danger)}
.ra{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.rb{display:flex}
.time{background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font-size:.84rem;white-space:nowrap;cursor:pointer;color:var(--ink)}
.time.static{cursor:default}
.time.over{border-color:var(--danger)}
.time small{color:var(--ink-soft)}
.eb{display:flex}
.addrow{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0}
.note{color:var(--ink-soft);font-size:.9rem;margin:8px 0}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:12px 16px;margin:10px 0}
.card h2{font-size:1.05rem;margin-bottom:6px}
.card .lead{color:var(--ink-soft);font-size:.9rem;margin:0 0 6px}
.card .task{padding-left:0}
.warn{color:var(--danger);font-weight:700}
.hrow{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:baseline;flex-wrap:wrap}
.hrow.click{cursor:pointer}
.hrow:last-child{border-bottom:0}
.hrow .d{flex:1;font-weight:700;min-width:120px}
.hrow .x{color:var(--ink-soft);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin:10px 0}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
.stat strong{display:block;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1.45rem}
.stat span{color:var(--ink-soft);font-size:.85rem}
.bar{display:grid;grid-template-columns:52px 1fr 92px;gap:8px;align-items:center;margin:6px 0;font-size:.9rem}
.bar .track{height:14px;background:var(--paper);border-radius:4px;overflow:hidden;position:relative}
.bar .fill{height:100%;background:var(--mark)}
.bar .fill.ok{background:var(--ok)}
.bar .v{text-align:right;color:var(--ink-soft);font-size:.85rem}
.navrow{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.navrow h2{flex:1;font-size:1.1rem;text-align:center}
.navrow .btn{width:40px;padding:0}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat .hd{font-size:.72rem;color:var(--ink-soft);text-align:center}
.heat .cell{aspect-ratio:1;border-radius:6px;background:var(--paper);position:relative;overflow:hidden;border:1px solid var(--rule);cursor:pointer;padding:0}
.heat .cell i{position:absolute;inset:0;background:var(--mark)}
.heat .cell b{position:relative;font-size:.72rem;font-weight:700;color:var(--ink)}
.heat .cell.l3 b,.heat .cell.l4 b{color:var(--mark-ink)}
.heat .cell.today{border:2px solid var(--ink)}
.heat .blank{visibility:hidden}
.legend{display:flex;gap:6px;align-items:center;font-size:.78rem;color:var(--ink-soft);margin-top:8px;flex-wrap:wrap}
.legend span{width:14px;height:14px;border-radius:3px;background:var(--mark);display:inline-block}
.rate{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.rate .lbl{width:64px;font-size:.9rem;font-weight:700}
.rate button{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);cursor:pointer}
.rate button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
textarea.big{width:100%;min-height:80px;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:9px 11px;resize:vertical}
label.fl{display:block;font-weight:700;font-size:.9rem;margin:10px 0 4px}
dialog{border:1px solid var(--rule);border-radius:16px;background:var(--sheet);color:var(--ink);padding:0;width:min(470px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(10,16,26,.45)}
dialog form{padding:18px}
dialog h2{font-size:1.15rem;margin-bottom:4px}
dialog .sub2{color:var(--ink-soft);font-size:.88rem;margin:0 0 10px;white-space:pre-line}
.field{margin:12px 0}
.field>label{display:block;font-weight:700;font-size:.9rem;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:9px 11px}
.field textarea{min-height:72px;resize:vertical}
.field .hint{font-size:.8rem;color:var(--ink-soft);margin-top:3px}
.field h3{font-size:.95rem;margin-top:18px;padding-top:12px;border-top:1px solid var(--rule)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.err{color:var(--danger);font-size:.88rem;min-height:1.2em}
.dlgact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.dlgact .spacer{flex:1}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);border-radius:12px;padding:8px 8px 8px 14px;display:flex;gap:10px;align-items:center;z-index:20;max-width:calc(100% - 24px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast span{font-size:.9rem}
.toast button{background:var(--mark);color:var(--mark-ink);border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:.92rem;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--ink);flex:none}
.chk span{font-weight:400}
.folder{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:8px 10px}
.folder b{flex:1;min-width:120px;word-break:break-all}
.pill{display:inline-block;font-size:.75rem;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--rule)}
.pill.on{background:var(--ok);color:var(--sheet)}
.pill.err{background:var(--danger);color:var(--sheet)}
.wrap{padding:6px 14px calc(150px + env(safe-area-inset-bottom,0px))}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
header{padding:6px 0 8px}
.datebar{gap:6px}
.datebar h1{font-size:1.12rem}
.datebar .btn{width:42px;height:42px;min-height:42px}
.datebar #todayBtn{width:auto;padding:0 10px}
.summary{gap:10px;margin-top:4px;font-size:.85rem}
.summary strong{font-size:1.2rem}
.strip{grid-template-columns:repeat(auto-fit,minmax(34px,1fr));gap:3px;margin-top:6px}
.strip span{height:18px;font-size:.58rem}
.status{min-height:0;font-size:.75rem}
.status:empty{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips .btn{flex:none;min-height:38px}
.tools input[type=search],.tools select,.field input,.field select,.field textarea,textarea.big{font-size:16px}
.task{padding:9px 4px 9px 6px;gap:12px}
.task input[type=checkbox]{width:26px;height:26px;margin-top:1px}
.chk-ph{width:26px}
.icon{min-width:42px;min-height:42px}
.time{padding:6px 11px;min-height:34px}
details.goal>summary{min-height:56px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;background:var(--sheet);border-top:1px solid var(--rule);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
.bnav button{flex:1;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.74rem;color:var(--ink-soft);padding:6px 0;min-height:52px;border-radius:12px}
.bnav button span{font-size:1.15rem;line-height:1.2}
.bnav button[aria-selected="true"]{color:var(--ink);font-weight:700;background:var(--paper)}
.fab{position:fixed;right:max(16px,calc(50vw - 374px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:14;width:58px;height:58px;border-radius:18px;border:0;background:var(--ink);color:var(--sheet);font-size:2rem;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
body.timing .fab{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.timerbar{position:fixed;left:8px;right:8px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:14;margin:0 auto;max-width:760px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.toast{bottom:calc(144px + env(safe-area-inset-bottom,0px))}
body.timing .toast{bottom:calc(214px + env(safe-area-inset-bottom,0px))}
.timerbar{flex-wrap:nowrap;gap:6px;padding:8px 8px 8px 12px}
.timerbar .tt{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.8rem}
.timerbar .tt b{font-size:1.25rem;display:inline;margin-right:6px}
.timerbar .tt .sub3{display:block;overflow:hidden;text-overflow:ellipsis}
.timerbar .btn{flex:none;min-height:40px;padding:4px 10px}
@media (max-width:600px){
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:92vh;border-bottom:0}
  dialog form{padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
  .dlgact .btn{flex:1}
  .dlgact .spacer{display:none}
  .bar{grid-template-columns:44px 1fr 84px}
}
@media (prefers-reduced-motion: reduce){.strip span i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="datebar">
      <button class="btn" id="prev" aria-label="Previous day">‹</button>
      <h1 id="dateLabel" tabindex="0" title="Pick a date">Today</h1>
      <input type="date" id="datePick" aria-label="Pick a date" tabindex="-1">
      <button class="btn" id="next" aria-label="Next day">›</button>
      <button class="btn small" id="todayBtn" hidden>Today</button>
      <button class="btn" id="settingsBtn" aria-label="Settings">⚙</button>
    </div>
    <div class="summary">
      <span><strong id="sDone">0</strong> done</span>
      <span><strong id="sMin">0</strong> spent</span>
      <span id="sGoals"></span>
      <span id="sProfile"></span>
    </div>
    <div class="budget" id="budget" hidden></div>
    <div class="strip" id="strip" aria-hidden="true"></div>
    <div class="status" id="status" role="status"></div>
  </header>

  <div id="banner"></div>


  <section id="dayView">
    <div class="tools">
      <input type="search" id="q" placeholder="Search tasks or codes" aria-label="Search tasks">
      <select id="filter" aria-label="Show">
        <option value="all">All tasks</option>
        <option value="today">Only today's (focus + logged)</option>
        <option value="focus">Today's focus</option>
        <option value="pending">Not logged today</option>
        <option value="logged">Logged today</option>
        <option value="starred">Starred</option>
        <option value="due">With due dates</option>
        <option value="progress">One-time, in progress</option>
        <option value="completed">One-time, completed</option>
      </select>
    </div>
    <div class="chips">
      <button class="btn small" id="editToggle" aria-pressed="false">Edit plan</button>
      <button class="btn small" id="undoBtn" disabled>Undo</button>
      <button class="btn small" id="shareBtn">Share day</button>
      <button class="btn small" id="expandAll">Expand all</button>
      <button class="btn small" id="collapseAll">Collapse all</button>
    </div>
    <div id="dayBody"></div>
  </section>
  <section id="weekView" hidden></section>
  <section id="historyView" hidden></section>
  <section id="insightsView" hidden></section>
</div>

<div class="timerbar" id="timerBar" hidden></div>
<button class="fab" id="fab" aria-label="Quick add a task">+</button>
<nav class="bnav" role="tablist" aria-label="Sections">
  <button role="tab" aria-selected="true" data-tab="day"><span aria-hidden="true">✓</span>Day</button>
  <button role="tab" aria-selected="false" data-tab="week"><span aria-hidden="true">▦</span>Week</button>
  <button role="tab" aria-selected="false" data-tab="history"><span aria-hidden="true">≡</span>History</button>
  <button role="tab" aria-selected="false" data-tab="insights"><span aria-hidden="true">◔</span>Insights</button>
</nav>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>
<dialog id="dlg"><form method="dialog" id="dlgForm" novalidate></form></dialog>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>
<input type="file" id="logFile" accept=".csv,text/csv" hidden>
<input type="file" id="planFile" accept=".csv,text/csv" hidden>
<script>
const STARTER = [

const STARTER_TARGETS={NRM:{type:"minutes",value:300},JOB:{type:"minutes",value:300},HLT:{type:"sessions",value:4},IRL:{type:"sessions",value:1}};
function starterPlan(){
  return {v:3,goals:STARTER.map(([gc,gn,subs])=>({code:gc,name:gn,target:STARTER_TARGETS[gc]||null,nextSub:subs.length+1,
    subs:subs.map(([sn,ts],si)=>({code:pad(si+1),name:sn,nextTask:ts.length+1,
      tasks:ts.map(([t,m],ti)=>{const code=pad(ti+1);return {code,text:t,min:m,kind:ONCE.has(`${gc}-${pad(si+1)}-${code}`)?"once":"repeat",due:"",star:false}})}))}))};
}
function migratePlan(p){
  if(!p||!Array.isArray(p.goals)) return starterPlan();
  const old=(p.v||1)<3;
  p.goals.forEach(g=>{
    if(g.target===undefined) g.target=old?(STARTER_TARGETS[g.code]||null):null;
    g.subs=g.subs||[]; g.nextSub=g.nextSub||g.subs.length+1;
    g.subs.forEach(s=>{s.tasks=s.tasks||[]; s.nextTask=s.nextTask||s.tasks.length+1;
      s.tasks.forEach(t=>{const c=`${g.code}-${s.code}-${t.code}`;
        if(!t.kind) t.kind=ONCE.has(c)?"once":"repeat"; t.due=t.due||""; t.star=!!t.star; t.min=+t.min||30;});});
  });
  p.v=3; return p;
}

/* Storage: localStorage by default. Inside the Claude app, everything is mirrored
   in memory (MEM) and saved to your Claude account, so it syncs phone <-> computer. */
const MEM=new Map(); let REMOTE=null;
function rawGet(k){
  if(REMOTE){const v=MEM.get(k);return v===undefined?null:clone(v)}
  try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}
}
function rawSet(k,v){
  if(REMOTE){MEM.set(k,clone(v));queueRemote(k);return true}
  try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){status("Couldn't save: this browser's storage is full or blocked.");return false}
}
function rawDel(k){if(REMOTE){MEM.delete(k);queueRemote(k);return}try{localStorage.removeItem(k)}catch(e){}}
function rawKeys(){if(REMOTE)return [...MEM.keys()];try{return Object.keys(localStorage)}catch(e){return []}}
let profiles=rawGet(PKEY)||{list:[{id:"",name:"Me"}],current:""};
let LS=prefixFor(profiles.current);
const lsGet=k=>rawGet(LS+k), lsSet=(k,v)=>rawSet(LS+k,v);
function lsDel(k){rawDel(LS+k)}
function lsKeys(){return rawKeys().filter(k=>k.startsWith(LS)).map(k=>k.slice(LS.length))}

/* remote write queue: one write at a time per document, coalesced */
const RQ=new Map(), RBUSY=new Set();
let syncTimer=null;
function queueRemote(k){RQ.set(k,true);clearTimeout(syncTimer);syncTimer=setTimeout(flushRemote,400)}
async function flushRemote(){
  if(!REMOTE)return;
  const keys=[...RQ.keys()];RQ.clear();
  let failed=0;
  await Promise.all(keys.map(async k=>{
    if(RBUSY.has(k)){RQ.set(k,true);return}
    RBUSY.add(k);
    try{const ref=REMOTE.col.doc(k);if(MEM.has(k))await ref.set({k,v:MEM.get(k)});else await ref.delete()}
    catch(e){failed++;RQ.set(k,true)}
    finally{RBUSY.delete(k)}
  }));
  if(RQ.size) syncTimer=setTimeout(flushRemote,failed?5000:400);
  status(failed?"Not synced yet. Changes are kept and will retry.":"Synced to your Claude account");
}
async function loadRemote(col){
  const out=new Map();let last="";
  for(let i=0;i<50;i++){
    const snap=await col.where("k",">",last).orderBy("k").limit(1000).get();
    snap.docs.forEach(d=>{const b=d.data();if(b&&typeof b.k==="string")out.set(b.k,b.v)});
    if(snap.size<1000)break; last=snap.docs[snap.docs.length-1].data().k;
  }
  return out;
}

/* ================= days & index ================= */
function normEntries(raw){
  const out={}; if(!raw) return out;
  const src=raw.entries||raw.done||{};
  for(const [c,v] of Object.entries(src)){
    const f=findTask(c);
    if(v===true) out[c]={status:"done",min:f?f.t.min:30,est:f?f.t.min:30,note:"",text:f?f.t.text:c,goal:c.split("-")[0],goalName:f?f.g.name:"",sub:f?f.s.name:""};
    else if(v&&typeof v==="object") out[c]={...v};
  }
  return out;
}
function readDay(k){const r=lsGet(k)||{};return {entries:normEntries(r),focus:Array.isArray(r.focus)?r.focus:[],refl:r.refl&&typeof r.refl==="object"?r.refl:{}}}
function dayIsEmpty(d){return !Object.keys(d.entries).length&&!d.focus.length&&!d.refl.note&&!d.refl.energy&&!d.refl.mood}
function writeDay(k,d){
  if(dayIsEmpty(d)) lsDel(k);
  else{const es=Object.values(d.entries);lsSet(k,{date:k,entries:d.entries,focus:d.focus,refl:d.refl,count:es.filter(e=>e.status==="done").length,minutes:es.reduce((a,e)=>a+(+e.min||0),0)})}
}
let ALL=[], IDX={};
function rebuild(){
  ALL=lsKeys().filter(isDateKey).sort().map(k=>({date:k,...readDay(k)}));
  IDX={};
  ALL.forEach(d=>Object.entries(d.entries).forEach(([c,e])=>{
    const x=IDX[c]||(IDX[c]={min:0,n:0,doneOn:null,first:d.date,last:d.date});
    x.min+=+e.min||0;x.n++;x.last=d.date;if(e.status==="done"&&!x.doneOn)x.doneOn=d.date;
  }));
}
const dayMin=d=>Object.values(d.entries).reduce((a,e)=>a+(+e.min||0),0);

/* ================= plan helpers ================= */
function findTask(full){
  const [gc,sc,tc]=String(full).split("-");
  const g=plan.goals.find(x=>x.code===gc); const s=g&&g.subs.find(x=>x.code===sc); const t=s&&s.tasks.find(x=>x.code===tc);
  return t?{g,s,t,full}:null;
}
function allTasks(){const out=[];plan.goals.forEach(g=>g.subs.forEach(s=>s.tasks.forEach(t=>out.push({g,s,t,full:`${g.code}-${s.code}-${t.code}`}))));return out}
const isComplete=(f)=>f.t.kind==="once"&&IDX[f.full]&&IDX[f.full].doneOn;
const hiddenOn=(f,k)=>{const c=isComplete(f);return !!(c&&c<k)};
function weekAgg(mon){
  const end=addDays(mon,6), agg={};
  ALL.forEach(d=>{if(d.date<mon||d.date>end)return;Object.entries(d.entries).forEach(([c,e])=>{const g=c.split("-")[0];const a=agg[g]||(agg[g]={sessions:0,minutes:0});a.sessions++;a.minutes+=+e.min||0})});
  return agg;
}
function targetProgress(g,agg){
  if(!g.target||!g.target.value) return null;
  const a=agg[g.code]||{sessions:0,minutes:0};
  const val=g.target.type==="minutes"?a.minutes:a.sessions;
  return {val,goal:g.target.value,met:val>=g.target.value,label:g.target.type==="minutes"?`${fmtMin(val)} / ${fmtMin(g.target.value)}`:`${val} / ${g.target.value} sessions`};
}
function onceProgress(g){let tot=0,done=0;g.subs.forEach(s=>s.tasks.forEach(t=>{if(t.kind!=="once")return;tot++;if(IDX[`${g.code}-${s.code}-${t.code}`]?.doneOn)done++}));return {tot,done}}

/* ================= undo ================= */
const UNDO=[];
function snap(label,keys){UNDO.push({label,plan:clone(plan),days:Object.fromEntries((keys||[CK]).map(k=>[k,clone(lsGet(k))]))});if(UNDO.length>40)UNDO.shift();$("undoBtn").disabled=false}
function undo(){
  const u=UNDO.pop(); if(!u){toast("Nothing to undo",false);return}
  plan=u.plan;savePlan();
  Object.entries(u.days).forEach(([k,v])=>v?lsSet(k,v):lsDel(k));
  rebuild();D=readDay(CK);render();toast(`Undone: ${u.label}`,false);
  $("undoBtn").disabled=!UNDO.length;
}

function openForm({title,subtitle,fields=[],submit="Save",onSubmit,danger,cancel="Cancel",onMount}){
  const f=$("dlgForm");
  f.innerHTML=`<h2>${esc(title)}</h2>${subtitle?`<p class="sub2">${esc(subtitle)}</p>`:""}`+
    fields.map(x=>{
      if(x.type==="heading") return `<div class="field"><h3>${esc(x.label)}</h3>${x.hint?`<div class="hint">${esc(x.hint)}</div>`:""}</div>`;
      if(x.type==="html") return `<div class="field">${x.html}</div>`;
      if(x.type==="checkbox") return `<div class="field"><label class="chk"><input type="checkbox" name="${x.name}" id="f_${x.name}" value="1" ${x.value?"checked":""}> <span>${esc(x.label)}</span></label>${x.hint?`<div class="hint">${esc(x.hint)}</div>`:""}</div>`;
      let input;
      if(x.type==="select") input=`<select name="${x.name}" id="f_${x.name}">${x.options.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(x.value)?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
      else if(x.type==="textarea") input=`<textarea name="${x.name}" id="f_${x.name}" placeholder="${esc(x.placeholder||"")}" ${x.readonly?"readonly":""}>${esc(x.value||"")}</textarea>`;
      else input=`<input name="${x.name}" id="f_${x.name}" type="${x.type||"text"}" value="${esc(x.value??"")}" ${x.type==="number"?`inputmode="decimal" min="0" step="${x.step||5}"`:""} ${x.maxlength?`maxlength="${x.maxlength}"`:""} ${x.readonly?"readonly":""} placeholder="${esc(x.placeholder||"")}">`;
      const quick=x.quick?`<div class="quick">${x.quick.map(q=>`<button type="button" class="btn small" data-q="${x.name}" data-v="${q}">${q>0?"+"+q:q}</button>`).join("")}</div>`:"";
      return `<div class="field"><label for="f_${x.name}">${esc(x.label)}</label>${input}${quick}${x.hint?`<div class="hint">${esc(x.hint)}</div>`:""}</div>`;
    }).join("")+
    `<div class="err" id="dlgErr"></div><div class="dlgact">${danger?`<button type="button" class="btn danger" id="dlgDanger">${esc(danger.label)}</button><span class="spacer"></span>`:""}${cancel?`<button type="button" class="btn" id="dlgCancel">${esc(cancel)}</button>`:""}${submit?`<button type="submit" class="btn primary">${esc(submit)}</button>`:""}</div>`;
  f.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const i=f.elements[b.dataset.q];i.value=Math.max(0,(parseFloat(i.value)||0)+parseFloat(b.dataset.v))});
  if(cancel) $("dlgCancel").onclick=()=>$("dlg").close();
  if(danger) $("dlgDanger").onclick=()=>{$("dlg").close();setTimeout(danger.onClick,0)};
  f.onsubmit=e=>{e.preventDefault();const vals=Object.fromEntries(new FormData(f));const err=onSubmit&&onSubmit(vals);if(err){$("dlgErr").textContent=err;return}$("dlg").close()};
  $("dlg").showModal();
  if(onMount) onMount(f);
  const first=f.querySelector("input:not([readonly]),select,textarea"); if(first&&!("ontouchstart" in window)) first.focus();
}

const mkEntry=(f,o)=>({text:f.t.text,goal:f.g.code,goalName:f.g.name,sub:f.s.name,est:f.t.min,note:"",at:Date.now(),...o});
function quickToggle(full,checked){
  const f=findTask(full); if(!f) return;
  if(checked){try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}act(`Logged ${full}`,()=>{D.entries[full]=mkEntry(f,{status:"done",min:f.t.min})})}
  else act(`Removed log for ${full}`,()=>{delete D.entries[full]});
}
function openLog(full,addMin){
  const f=findTask(full); if(!f) return;
  const e=D.entries[full], once=f.t.kind==="once", ix=IDX[full];
  const base=e?+e.min:0;
  const preset=addMin?base+addMin:(e?e.min:f.t.min);
  let sub=`${full} · estimated ${f.t.min} min · ${once?"one-time task":"repeating task"}`;
  if(addMin) sub+=`\nTimer recorded ${addMin} min${e?` (added to the ${base} min already logged)`:""}.`;
  if(once&&ix&&!e) sub+=`\nSo far: ${fmtMin(ix.min)} over ${ix.n} session${ix.n>1?"s":""}.`;
  openForm({
    title:f.t.text, subtitle:sub,
    fields:[
      {name:"status",label:"Status",type:"select",value:e?e.status:"done",options:once?[["done","Finished, task complete"],["partial","Worked on it, continue another day"]]:[["done","Done"],["partial","Partly done"]]},
      {name:"min",label:"Time actually spent today (minutes)",type:"number",value:preset,quick:[-15,-5,5,15,30]},
      {name:"note",label:"Note (optional)",type:"textarea",value:e?e.note:"",placeholder:"What did you get done? Any blockers?"},
      {name:"est",label:"Update the estimate for next time?",type:"select",value:"keep",options:[["keep",`Keep ${f.t.min} min`],["use","Use this time as the new estimate"]]}
    ],
    submit:e?"Update log":"Log task",
    danger:e?{label:"Remove log",onClick:()=>act(`Removed log for ${full}`,()=>{delete D.entries[full]})}:null,
    onSubmit:v=>{
      const m=Math.round(parseFloat(v.min)); if(isNaN(m)||m<0||m>1440) return "Enter minutes between 0 and 1440.";
      act(`${e?"Updated":"Logged"} ${full}`,()=>{
        const est=e?.est??f.t.min;
        if(v.est==="use"&&m>0) f.t.min=m;
        D.entries[full]=mkEntry(f,{status:v.status,min:m,note:v.note.trim(),at:e?.at||Date.now(),est});
      });
    }
  });
}
function togglePin(full){

  act(on?`Removed ${full} from focus`:`Added ${full} to today's focus`,()=>{D.focus=on?D.focus.filter(x=>x!==full):[...D.focus,full]});

function counted(r=S.running){return r?r.acc+(r.seg&&!r.paused?Date.now()-r.seg:0):0}
function startTimer(full){
  if(S.running){toast(`A timer is already running for ${S.running.code}. Stop it first.`,false);return}
  const f=findTask(full); if(!f) return;
  openForm({
    title:"Start a timer", subtitle:`${full} · ${f.t.text}`,
    fields:[{name:"mode",label:"Mode",type:"select",value:"free",options:[["free","Stopwatch"],["pomo",`Pomodoro: ${S.pomoFocus} min focus, ${S.pomoBreak} min break`]]}],
    submit:"Start",
    onSubmit:v=>{
      const now=Date.now();
      S.running={code:full,date:CK,mode:v.mode,acc:0,seg:now,phase:"focus",phaseEnd:v.mode==="pomo"?now+S.pomoFocus*60000:null,paused:false,remaining:0,round:1};
      saveSettings();renderTimer();

}
function pauseTimer(){
  const r=S.running;if(!r)return;const now=Date.now();
  if(!r.paused){if(r.seg){r.acc+=now-r.seg;r.seg=null}if(r.phaseEnd){r.remaining=r.phaseEnd-now}r.paused=true}
  else{r.paused=false;if(r.phase==="focus")r.seg=now;if(r.mode==="pomo")r.phaseEnd=now+r.remaining}
  saveSettings();renderTimer();
}
function stopTimer(){
  const r=S.running;if(!r)return;
  const m=Math.max(1,Math.round(counted(r)/60000));
  S.running=null;saveSettings();document.title="Goal Tracker";renderTimer();
  if(!findTask(r.code)){toast("That task is no longer in your plan, so the time wasn't logged.",false);return}
  if(r.date!==CK) openDate(r.date);
  showTab("day");
  openLog(r.code,m);
}
function discardTimer(){confirmBox("Discard this timer?","The time won't be logged.","Discard",()=>{S.running=null;saveSettings();document.title="Goal Tracker";renderTimer()})}
function beep(){
  try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,0.35].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start(a.currentTime+t);o.stop(a.currentTime+t+.2)});setTimeout(()=>a.close(),1200)}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
function tick(){
  const r=S.running;if(!r)return;
  if(r.mode==="pomo"&&!r.paused){
    let changed=false;const now=Date.now();
    while(now>=r.phaseEnd){
      if(r.phase==="focus"){r.acc+=r.phaseEnd-r.seg;r.seg=null;r.phase="break";r.phaseEnd+=S.pomoBreak*60000}
      else{r.phase="focus";r.seg=r.phaseEnd;r.phaseEnd+=S.pomoFocus*60000;r.round++}
      changed=true;
    }
    if(changed){saveSettings();beep();toast(r.phase==="break"?`Focus block done. Take a ${S.pomoBreak}-minute break.`:"Break over. Back to focus.",false);renderTimer();return}
  }
  updateTimerText();
}
function updateTimerText(){
  const r=S.running;if(!r||!$("tEl"))return;
  $("tEl").textContent=mmss(counted(r));
  let ph=r.paused?"Paused":"Running";
  if(r.mode==="pomo"){const left=r.paused?r.remaining:r.phaseEnd-Date.now();ph=`${r.paused?"Paused · ":""}${r.phase==="focus"?`Focus ${r.round}`:"Break"} · ${mmss(left)} left`}
  $("tPh").textContent=ph;
  document.title=`${r.paused?"⏸":"▶"} ${mmss(counted(r))} · ${r.code}`;
}
let WL=null;
async function syncWakeLock(){
  const want=S.running&&!S.running.paused&&!document.hidden;
  try{
    if(want&&!WL&&navigator.wakeLock){WL=await navigator.wakeLock.request("screen");WL.addEventListener("release",()=>{WL=null})}
    else if(!want&&WL){await WL.release();WL=null}
  }catch(e){WL=null}
}
function renderTimer(){
  const r=S.running, el=$("timerBar");
  document.body.classList.toggle("timing",!!r);syncWakeLock();

    <button class="btn small" id="tPause" aria-label="${r.paused?"Resume":"Pause"} timer">${r.paused?"▶":"❚❚"}</button><button class="btn small primary" id="tStop">Stop &amp; log</button><button class="btn small" id="tDiscard" aria-label="Discard timer">✕</button>`;

function dueBadge(t){

  const d=diffDays(CK,t.due);
  return `<span class="bd ${d<0?"late":d<=2?"soon":""}">${d<0?`Overdue ${-d}d`:d===0?"Due today":d===1?"Due tomorrow":`Due ${esc(short(t.due))}`}</span>`;
}
function taskRow(f,opts={}){
  const {g,s,t,full}=f, e=D.entries[full], ix=IDX[full], once=t.kind==="once", comp=isComplete(f), doneElsewhere=comp&&comp!==CK&&!e;
  const b=[];

  const ctx=opts.ctx?`<span class="n">${esc(g.name)} › ${esc(s.name)}</span>`:"";

  }

  if(doneElsewhere) return `<div class="task ${cls}"><span class="chk-ph" aria-label="Completed">✓</span><span class="t"><span class="c">${b.join("")}</span><span class="txt">${esc(t.text)}</span>${ctx}</span></div>`;
  const pinned=D.focus.includes(full);
  const timeLbl=e?`${e.min}m${e.min!==e.est?` <small>/ ${e.est}</small>`:""}${e.status==="partial"?" · partly":""}`:`${t.min}m`;
  const running=S.running&&S.running.code===full;
  return `<div class="task ${cls}">
    <input type="checkbox" data-code="${full}" ${e&&e.status==="done"?"checked":""} aria-label="Mark ${full} done">
    <span class="t" data-open="${full}"><span class="c">${b.join("")}</span><span class="txt">${esc(t.text)}</span>${ctx}${e&&e.note?`<span class="n">${esc(e.note)}</span>`:""}${prog}</span>
    <span class="ra"><button class="time ${e&&e.min>e.est?"over":""}" data-open="${full}" aria-label="Log time for ${full}">${timeLbl}</button>
    <span class="rb"><button class="icon ${pinned?"on":""}" data-pin="${full}" aria-pressed="${pinned}" aria-label="${pinned?"Remove from":"Add to"} today's focus" title="Today's focus">📌</button><button class="icon ${running?"on":""}" data-timer="${full}" aria-label="Start timer for ${full}" title="Timer">▶</button></span></span>
  </div>`;
}
function passes(f,filt,q){
  const {g,s,t,full}=f, e=D.entries[full], comp=isComplete(f);
  if(q&&!(`${full} ${t.text} ${s.name} ${g.name}`.toLowerCase().includes(q))) return false;
  const vis=!hiddenOn(f,CK);
  switch(filt){
    case "today": return vis&&(!!e||D.focus.includes(full));
    case "focus": return vis&&D.focus.includes(full);
    case "pending": return vis&&!e&&!(comp&&comp<=CK);
    case "logged": return !!e;
    case "starred": return vis&&t.star;
    case "due": return !!t.due&&!comp;
    case "progress": return t.kind==="once"&&!comp&&!!IDX[full];
    case "completed": return !!comp;
    default: return vis;
  }
}

function daySummary(){
  const es=Object.entries(D.entries), done=es.filter(([,e])=>e.status==="done"), part=es.filter(([,e])=>e.status!=="done");
  const L=[`📅 ${fmtDate(CK,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}`,`✅ ${done.length} done${part.length?` · 🟡 ${part.length} partly`:""} · ⏱ ${fmtMin(dayMin(D))}`];
  if(D.focus.length){const fd=D.focus.filter(c=>D.entries[c]?.status==="done").length;L.push(`🎯 Focus: ${fd}/${D.focus.length} done`)}

/* periods */
const ym=k=>k.slice(0,7);
function monthEnd(m){const [y,mo]=m.split("-").map(Number);return key(new Date(y,mo,0,12))}
function prevMonth(m){const [y,mo]=m.split("-").map(Number);return key(new Date(y,mo-2,1,12)).slice(0,7)}
function nextMonth(m){const [y,mo]=m.split("-").map(Number);return key(new Date(y,mo,1,12)).slice(0,7)}
function slug(){if(profiles.list.length<2)return "";const n=(profiles.list.find(p=>p.id===profiles.current)||{}).name||"";return n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"_"}
function periodOf(freq,k){
  if(freq==="daily") return {freq,id:k,start:k,end:k,dir:"daily",name:`goal-tracker_${slug()}day_${k}.csv`,label:fmtDate(k)};
  if(freq==="weekly"){const m=mondayOf(k),e=addDays(m,6);return {freq,id:m,start:m,end:e,dir:"weekly",name:`goal-tracker_${slug()}week_${m}_to_${e}.csv`,label:`week of ${short(m)}`}}

}

/* main runner: exports finished periods; interactive=true when the user tapped a button */
async function runAutoExport(interactive,{now=false}={}){
  const ax=AXc();
  if((!ax.on&&!now)||axBusy) return;
  axBusy=true;
  try{
    let list=now?[]:pendingPeriods();
    if(now){const t=todayKey();if(ax.daily)list.push(periodOf("daily",t));if(ax.weekly)list.push(periodOf("weekly",t));if(ax.monthly)list.push(periodOf("monthly",t));}
    if(!list.length){AXNEED=null;return}
    let h=null;

      h=await getDir(interactive);

        const has=DIRCACHE[dirKey()]||await idbGet(dirKey());
        AXNEED={n:list.length,folder:ax.folderName||"your export folder"};
        if(!has) AXNEED.folder="(no folder chosen yet)";

        return;

      try{
        const where=await writeOut(h,p.dir,p.name,csv,"text/csv");
        saved++;axLog({freq:p.freq,file:where,rows:n,ok:true,label:p.label});lines.push([new Date().toISOString(),p.freq,where,n,"saved"]);
      }catch(e){axLog({freq:p.freq,file:p.name,rows:n,ok:false,err:String(e&&e.message||e)});lines.push([new Date().toISOString(),p.freq,p.name,n,"failed: "+(e&&e.message||e)]);break}
      if(!now) ax.last[p.freq]=p.id;
      saveSettings();
    }
    if(saved&&(ax.plan||ax.backup)){
      const t=todayKey();
      try{
        if(ax.plan){const w=await writeOut(h,"plan",h?`goal-tracker_${slug()}plan_latest.csv`:`goal-tracker_${slug()}plan_${t}.csv`,planCSV(),"text/csv");lines.push([new Date().toISOString(),"plan",w,"","saved"])}
        if(ax.backup){const w=await writeOut(h,"backups",`goal-tracker_${slug()}backup_${t}.json`,backupJSON(),"application/json");lines.push([new Date().toISOString(),"backup",w,"","saved"]);S.lastBackup=Date.now()}
      }catch(e){axLog({freq:"extra",file:"plan/backup",rows:0,ok:false,err:String(e&&e.message||e)})}
    }
    await appendLogFile(h,lines);

    if(saved) toast(`Auto export: saved ${saved} file${saved>1?"s":""} ${h?`to "${ax.folderName}"`:"to Downloads"}${skipped?` (${skipped} empty skipped)`:""}`,false);
    else if(interactive&&!now) toast(skipped?`Nothing to save: ${skipped} period${skipped>1?"s":""} had no logs.`:"Auto export is up to date.",false);
  }finally{axBusy=false;renderBanner();if(TAB==="history")renderAxCard()}
}

const toCSV=rows=>"\ufeff"+rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
function parseCSV(text){
  text=String(text).replace(/^\ufeff/,"");

  const delim=(firstLine.match(/;/g)||[]).length>(firstLine.match(/,/g)||[]).length?";":",";
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===delim){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row)}
  const clean=rows.filter(r=>r.some(x=>x.trim()!==""));
  if(!clean.length)return {head:[],data:[]};
  const head=clean[0].map(h=>h.trim().toLowerCase().replace(/\s+/g,"_"));
  return {head,data:clean.slice(1).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??"").trim()])))};
}
function normDate(v){

  if(m=v.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/))return ok(+m[1],+m[2],+m[3]);
  if(m=v.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/))return ok(m[3].length===2?2000+ +m[3]:+m[3],+m[2],+m[1]);

}

  });

  saveFile(`goal-tracker-backup-${todayKey()}.json`,JSON.stringify(out),"application/json");
  S.lastBackup=Date.now();saveSettings();renderBanner();if(TAB==="history")renderHistory();
  toast("Backup downloaded. Keep it somewhere safe, like Google Drive.",false);
}
function restoreBackup(){pickFile("restoreFile",text=>{
  let j;try{j=JSON.parse(text)}catch(e){}
  if(!j||j.app!=="goal-tracker"||!j.data){status("That file isn't a Goal Tracker backup.");return}
  confirmBox("Restore this backup?",`Backup${j.profile?` of "${j.profile}"`:""} from ${String(j.exported||"").slice(0,10)}.\nIt goes into the current profile. Your plan and any days in the backup replace what's here; days not in the backup are kept.`,"Restore",()=>{
    const running=S.running;
    Object.entries(j.data).forEach(([k,v])=>{if(v!=null)lsSet(k,v)});
    loadSettings();S.running=running;saveSettings();loadPlan();rebuild();D=readDay(CK);UNDO.length=0;$("undoBtn").disabled=true;render();toast("Backup restored",false);
  });
})}

/* ================= settings & profiles ================= */
function switchProfile(id){
  profiles.current=id;rawSet(PKEY,profiles);LS=prefixFor(id);
  loadSettings();loadPlan();rebuild();UNDO.length=0;$("undoBtn").disabled=true;OPEN.clear();
  editing=false;$("editToggle").textContent="Edit plan";$("editToggle").classList.remove("primary");
  AXNEED=null;openDate(todayKey());renderTimer();setTimeout(()=>runAutoExport(false),300);
}
$("settingsBtn").onclick=()=>{
  const curP=profiles.list.find(p=>p.id===profiles.current)||profiles.list[0];
  openForm({
    title:"Settings",
    fields:[
      {name:"theme",label:"Appearance",type:"select",value:S.theme,options:[["auto","Match my device"],["light","Light"],["dark","Dark"]]},
      {name:"budget",label:"Daily time budget (hours)",type:"number",step:"0.5",value:S.budget||"",placeholder:"Leave empty for no budget",hint:"Shows how your logged time compares with the hours you have each day."},
      {name:"pf",label:"Pomodoro focus (minutes)",type:"number",step:"5",value:S.pomoFocus},
      {name:"pb",label:"Pomodoro break (minutes)",type:"number",step:"1",value:S.pomoBreak},
      {type:"heading",label:"Profiles"},
      {name:"profile",label:"Active profile",type:"select",value:profiles.current,options:profiles.list.map(p=>[p.id,p.name]),hint:"Each profile has its own plan, logs and settings."},
      {name:"rename",label:"Rename active profile",value:curP.name},
      {name:"newp",label:"Create a new profile",placeholder:"Name, e.g. Priya",hint:"Fill this in to create a profile and switch to it."}
    ],
    submit:"Save settings",
    danger:profiles.list.length>1?{label:"Delete active profile",onClick:()=>confirmBox(`Delete profile "${curP.name}"?`,"All its plan, logs and reflections are permanently erased from this browser. Download a backup first if you might need it.","Delete profile",()=>{
      lsKeys().forEach(lsDel);profiles.list=profiles.list.filter(p=>p.id!==curP.id);switchProfile(profiles.list[0].id);toast(`Deleted profile ${curP.name}`,false);
    })}:null,
    onSubmit:v=>{
      const bud=v.budget===""?0:parseFloat(v.budget),pf=parseInt(v.pf),pb=parseInt(v.pb);
      if(isNaN(bud)||bud<0||bud>24) return "Budget must be between 0 and 24 hours.";
      if(!(pf>=5&&pf<=120)) return "Pomodoro focus must be 5–120 minutes.";
      if(!(pb>=1&&pb<=60)) return "Pomodoro break must be 1–60 minutes.";
      const nn=v.newp.trim(),rn=v.rename.trim();
      if(nn&&profiles.list.some(p=>p.name.toLowerCase()===nn.toLowerCase())) return `A profile called ${nn} already exists.`;
      S.theme=v.theme;S.budget=bud;S.pomoFocus=pf;S.pomoBreak=pb;saveSettings();applyTheme();
      if(rn&&rn!==curP.name){curP.name=rn;rawSet(PKEY,profiles)}
      if(nn){const id=Date.now().toString(36);profiles.list.push({id,name:nn});rawSet(PKEY,profiles);switchProfile(id);toast(`Created profile ${nn}. It starts with the starter plan.`,false);return}
      if(v.profile!==profiles.current){switchProfile(v.profile);toast(`Switched to ${(profiles.list.find(p=>p.id===v.profile)||{}).name}`,false);return}
      render();
    }
  });
};

/* ================= navigation & boot ================= */
function showTab(t){
  TAB=t;
  document.querySelectorAll(".bnav [role=tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  window.scrollTo(0,0);
  ["day","week","history","insights"].forEach(x=>$(x+"View").hidden=x!==t);
  if(t==="week") wkStart=mondayOf(CK);
  render();
}
document.querySelectorAll(".bnav [role=tab]").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function render(){
  renderHeader();renderBanner();
  if(TAB==="day")renderDay();else if(TAB==="week")renderWeek();else if(TAB==="history")renderHistory();else renderInsights();
}
$("prev").onclick=()=>openDate(addDays(CK,-1));
$("next").onclick=()=>openDate(addDays(CK,1));
$("todayBtn").onclick=()=>{openDate(todayKey());if(TAB==="week"){wkStart=mondayOf(CK);renderWeek()}};
function pickDate(){const p=$("datePick");if(p.showPicker){try{p.showPicker();return}catch(e){}}p.style.pointerEvents="auto";p.focus();p.click()}
$("dateLabel").onclick=pickDate;$("dateLabel").onkeydown=e=>{if(e.key==="Enter")pickDate()};
$("datePick").onchange=e=>{if(e.target.value)openDate(e.target.value)};
let lastPull=0;
document.addEventListener("visibilitychange",async()=>{
  syncWakeLock();
  if(document.hidden){if(REMOTE)flushRemote();return}
  tick();renderHeader();runAutoExport(false);
  if(REMOTE&&!RQ.size&&!RBUSY.size&&Date.now()-lastPull>15000&&!$("dlg").open){
    lastPull=Date.now();
    try{const data=await loadRemote(REMOTE.col);if(RQ.size||RBUSY.size)return;MEM.clear();data.forEach((v,k)=>MEM.set(k,v));
      profiles=rawGet(PKEY)||profiles;LS=prefixFor(profiles.current);loadSettings();loadPlan();rebuild();D=readDay(CK);render();renderTimer()}catch(e){}
  }
});
setInterval(()=>runAutoExport(false),5*60*1000);

/* ================= quick add (phone) ================= */
function quickAdd(){
  if(!plan.goals.some(g=>g.subs.length)){editing=true;$("editToggle").textContent="Done editing";$("editToggle").classList.add("primary");render();editGoal(null);return}
  const opts=[];plan.goals.forEach(g=>g.subs.forEach(s=>opts.push([`${g.code}|${s.code}`,`${g.code}-${s.code} · ${s.name}`])));
  const def=opts.some(o=>o[0]===S.lastSub)?S.lastSub:opts[0][0];
  openForm({
    title:"Add a task",
    fields:[
      {name:"text",label:"Task",placeholder:"What will you do?"},
      {name:"sub",label:"Goal › sub-activity",type:"select",value:def,options:opts},
      {name:"min",label:"Estimated time (minutes)",type:"number",value:30,quick:[-15,15,30]},
      {name:"kind",label:"Type",type:"select",value:"once",options:[["once","One-time"],["repeat","Repeating"]]},
      {name:"due",label:"Due date (optional)",type:"date",value:""},
      {name:"focus",label:"Add to this day's focus",type:"checkbox",value:true},
      {name:"done",label:"Already done: log it now",type:"checkbox",value:false}
    ],
    submit:"Add task",
    onSubmit:v=>{
      const text=v.text.trim(),m=Math.round(parseFloat(v.min));
      if(!text)return "Describe the task.";
      if(isNaN(m)||m<1||m>600)return "Estimate must be between 1 and 600 minutes.";
      const [gc,sc]=v.sub.split("|");const g=plan.goals.find(x=>x.code===gc),s=g&&g.subs.find(x=>x.code===sc);if(!s)return "Pick a sub-activity.";
      S.lastSub=v.sub;saveSettings();
      act(`Added ${gc}-${sc} task`,()=>{
        const t={code:pad(s.nextTask++),text,min:m,kind:v.kind,due:v.due||"",star:false};s.tasks.push(t);
        const full=`${gc}-${sc}-${t.code}`;OPEN.add(gc);
        if(v.focus&&!D.focus.includes(full))D.focus.push(full);
        if(v.done)D.entries[full]=mkEntry({g,s,t},{status:"done",min:m});
      });
    }
  });
}
$("fab").onclick=quickAdd;

(function boot(){
  try{localStorage.setItem("goaltracker-test","1");localStorage.removeItem("goaltracker-test")}
  catch(e){status("This browser is blocking storage, so changes won't be kept. Open the file in Chrome, Edge, Safari or Firefox, outside private mode.")}
  loadSettings();loadPlan();savePlan();rebuild();D=readDay(CK);
  render();renderTimer();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  setTimeout(()=>runAutoExport(false),800);
  if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register("sw.js").then(reg=>{
      reg.addEventListener("updatefound",()=>{const w=reg.installing;w&&w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)toast("A new version is ready. Close and reopen the app to update.",false)})});
    }).catch(()=>{});
  }
  if(!$("status").textContent) status("Saved on this device.");
})();
</script>
